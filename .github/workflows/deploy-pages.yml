name: Build and deploy AllenKS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  dns-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect authoritative and public DNS
        run: |
          echo '=== NS ==='
          dig +short NS allenks.com.ar
          echo '=== AUTHORITATIVE A (ns1) ==='
          dig @ns1.wcaup.com allenks.com.ar A +noall +answer
          echo '=== AUTHORITATIVE A (ns2) ==='
          dig @ns2.wcaup.com allenks.com.ar A +noall +answer
          echo '=== AUTHORITATIVE WWW CNAME (ns1) ==='
          dig @ns1.wcaup.com www.allenks.com.ar CNAME +noall +answer
          echo '=== GOOGLE A ==='
          dig @8.8.8.8 allenks.com.ar A +noall +answer
          echo '=== CLOUDFLARE A ==='
          dig @1.1.1.1 allenks.com.ar A +noall +answer
          echo '=== GOOGLE WWW ==='
          dig @8.8.8.8 www.allenks.com.ar CNAME +noall +answer
          echo '=== HTTP APEX ==='
          curl -I -L --max-time 15 https://allenks.com.ar/ || true
          echo '=== HTTP WWW ==='
          curl -I -L --max-time 15 https://www.allenks.com.ar/ || true

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --silent --show-error "$PAGE_URL" -o deployed.html
          grep -q "ALLEN KS" deployed.html
          grep -q "GETTING STARTED" deployed.html

  verify-live:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Verify current GitHub Pages URL
        run: |
          curl --fail --location --silent --show-error https://alandiaz145.github.io/allenks-web-v2/ -o live.html
          grep -q "ALLEN KS" live.html
          grep -q "GETTING STARTED" live.html
